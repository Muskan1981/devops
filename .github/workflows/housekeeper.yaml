name: Nightly Housekeeper

on:
  schedule:
    - cron: '0 2 * * * '  # Runs at 2:00 AM UTC every day
  workflow_dispatch:

jobs:
    checkup:
            runs-on: ubuntu-latest
            steps:
                - name: Current date and time
                  run: date
                - name: a message
                  run: echo "Running nightly cleanup"
                - name: Finish
                  run: echo "Housekeeping complete"