name: Release Watcher

on:
  # push:
  #   branches:
  #     - main
  # schedule:
  #   - cron: '0 9 * * *'  # Runs at 9:00 AM UTC every day
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: prints the event name that triggered the workflow
        run: echo " Event that triggered the workflow is ${{ github.event_name }}."
      - name: current date and time
        run: date
      - name: Finish
        run: echo "Release watch complete"

